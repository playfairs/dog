<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jomvet</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top, #1d1d1d 0%, #050505 70%);
            color: #f5f5f5;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .card {
            width: min(100%, 580px);
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(17, 17, 17, 0.95);
            padding: 36px;
            border-radius: 1px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .eyebrow {
            font-size: 0.82rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: #c7b6ff;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2.6rem, 8vw, 4rem);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        p {
            margin: 0 0 14px;
            font-size: 1rem;
            line-height: 1.7;
            color: #e8e8e8;
        }

        button {
            border: 0;
            background: linear-gradient(135deg, #ffe26b 0%, #ffbf1f 100%);
            color: #111111;
            padding: 12px 20px;
            cursor: pointer;
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 1px;
            box-shadow: 0 10px 24px rgba(255, 191, 31, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(255, 191, 31, 0.28);
        }

        .dog-panel {
            margin-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.16);
            padding-top: 20px;
            display: none;
        }

        .dog-panel.show {
            display: block;
        }

        .dog-panel.angry .tiny {
            color: #ff8f8f;
        }

        video {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 1px;
            background: #1a1a1a;
            display: block;
            transition: filter 0.2s linear, transform 0.2s linear;
        }

        .tiny {
            font-size: 0.95rem;
            margin-top: 12px;
            color: #d0d0d0;
        }

        .owner-link {
            margin: 0 0 20px;
            font-size: 0.95rem;
            display: inline-block;
            padding: 8px 12px;
            border-radius: 1px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .owner-link a {
            color: #ffe26b;
            text-decoration: none;
            font-weight: 600;
        }

        .owner-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="eyebrow">hello gabe...</div>
        <h1>jomvet</h1>
        <p>can u click the buttons below pls and thanks</p>
        <p class="owner-link">Owner: <a href="https://www.instagram.com/mha.mahamek" target="_blank" rel="noopener noreferrer">@mha.mahamek</a></p>
        <button id="summonButton" type="button">summon jomvet</button>

        <section class="dog-panel" id="dogPanel">
            <video id="dogVideo" autoplay loop muted playsinline preload="auto" src="dog.mp4"></video>
            <p class="tiny" id="dogNote">jomvet has arrived. please act normal.</p>
        </section>
    </main>

    <script>
        const button = document.getElementById('summonButton');
        const panel = document.getElementById('dogPanel');
        const video = document.getElementById('dogVideo');
        const note = document.getElementById('dogNote');
        const angryMessages = [
            'jomvet has arrived. please act normal.',
            'jomvet is now mildly offended.',
            'jomvet is staring at you.',
            'jomvet wants you to stop.',
            'jomvet has chosen violence.',
            'jomvet is now very upset.',
            'jomvet is screaming internally.',
            'jomvet is absolutely not okay.',
            'ur deep frying jomvet in real time, STOP',
            'jomvet is now a menace.',
            'do you want to fucking die',
        ];
        let hasSeenDog = false;
        let angryClickCount = 0;
        let angryTimer = null;
        let audioContext = null;
        let audioSource = null;
        let distortionNode = null;
        let filterNode = null;
        let gainNode = null;

        function makeDistortionCurve(amount) {
            const samples = 2048;
            const curve = new Float32Array(samples);
            for (let i = 0; i < samples; i++) {
                const x = (i / samples) * 2 - 1;
                curve[i] = Math.tanh(x * amount) / Math.tanh(amount);
            }
            return curve;
        }

        function ensureAudioSetup() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioSource = audioContext.createMediaElementSource(video);
                filterNode = audioContext.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 1400;
                filterNode.Q.value = 1.1;

                distortionNode = audioContext.createWaveShaper();
                distortionNode.curve = makeDistortionCurve(2.6);
                distortionNode.oversample = '4x';

                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.9;

                audioSource.connect(filterNode);
                filterNode.connect(distortionNode);
                distortionNode.connect(gainNode);
                gainNode.connect(audioContext.destination);
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {});
            }
        }

        function updateDogMood() {
            const intensity = Math.min(8, angryClickCount);
            const fry = intensity * 0.16;
            video.style.filter = [
                `brightness(${1 + fry * 0.2})`,
                `contrast(${1 + fry * 0.5})`,
                `saturate(${1 + fry * 1.1})`,
                `hue-rotate(${fry * 10}deg)`,
                `sepia(${Math.min(0.35, fry * 0.12)})`,
                `grayscale(${Math.min(0.2, fry * 0.04)})`,
                `blur(${Math.min(0.4, fry * 0.03)}px)`
            ].join(' ');
            video.style.transform = `scale(${1 + fry * 0.01})`;
            panel.classList.toggle('angry', intensity >= 3);

            if (filterNode && distortionNode && gainNode) {
                if (intensity >= 3) {
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = Math.max(260, 900 - intensity * 90);
                    filterNode.Q.value = 1.0 + intensity * 0.16;
                    distortionNode.curve = makeDistortionCurve(2.2 + intensity * 0.6);
                    gainNode.gain.value = Math.max(0.3, 0.85 - intensity * 0.04);
                } else {
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = 1800;
                    filterNode.Q.value = 0.7;
                    distortionNode.curve = makeDistortionCurve(0.5);
                    gainNode.gain.value = 0.75;
                }
                video.playbackRate = Math.max(0.7, 1 - intensity * 0.05);
            }
        }

        function setRandomAngryText() {
            const message = angryMessages[Math.floor(Math.random() * angryMessages.length)];
            note.textContent = message;
        }

        button.addEventListener('click', () => {
            ensureAudioSetup();
            panel.classList.add('show');
            video.muted = false;
            video.play().catch(() => {});

            angryClickCount = Math.min(8, angryClickCount + 1);
            if (angryTimer) clearTimeout(angryTimer);
            angryTimer = setTimeout(() => {
                angryClickCount = Math.max(0, angryClickCount - 1);
                updateDogMood();
            }, 1100);

            updateDogMood();
            setRandomAngryText();
            button.textContent = angryClickCount >= 3 ? 'stop summoning jomvet' : 'summon again';
        });
    </script>
</body>
</html>
