<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jomvet</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #000000;
            color: #f5f5f5;
            font-family: "Courier New", Courier, monospace;
        }

        .card {
            width: min(100%, 560px);
            border: 2px solid #f5f5f5;
            background: #111111;
            padding: 32px;
            box-shadow: 8px 8px 0 #f5f5f5;
        }

        .eyebrow {
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2.6rem, 8vw, 4rem);
            line-height: 1;
        }

        p {
            margin: 0 0 14px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        button {
            border: 2px solid #f5f5f5;
            background: #ffef7a;
            color: #111111;
            padding: 12px 16px;
            cursor: pointer;
            font: inherit;
            font-size: 1rem;
            box-shadow: 4px 4px 0 #f5f5f5;
        }

        button:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #f5f5f5;
        }

        .dog-panel {
            margin-top: 20px;
            border-top: 2px solid #f5f5f5;
            padding-top: 20px;
            display: none;
        }

        .dog-panel.show {
            display: block;
        }

        .dog-panel.angry .tiny {
            color: #ff8f8f;
        }

        video {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 2px solid #f5f5f5;
            background: #1a1a1a;
            display: block;
            transition: filter 0.2s linear, transform 0.2s linear;
        }

        .tiny {
            font-size: 0.95rem;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="eyebrow">the greatest website ever</div>
        <h1>jomvet</h1>
        <p>please click the button below if you like dogs</p>
        <button id="summonButton" type="button">summon jomvet</button>

        <section class="dog-panel" id="dogPanel">
            <video id="dogVideo" autoplay loop muted playsinline preload="auto" src="dog.mp4"></video>
            <p class="tiny" id="dogNote">jomvet has arrived. please act normal.</p>
        </section>
    </main>

    <script>
        const button = document.getElementById('summonButton');
        const panel = document.getElementById('dogPanel');
        const video = document.getElementById('dogVideo');
        const note = document.getElementById('dogNote');
        const angryMessages = [
            'jomvet has arrived. please act normal.',
            'jomvet is now mildly offended.',
            'jomvet is staring at you.',
            'jomvet wants you to stop.',
            'jomvet has chosen violence.',
            'jomvet is now very upset.',
            'jomvet is screaming internally.',
            'jomvet is absolutely not okay.',
            'ur deep frying the dog in real time, STOP',
            'jomvet is now a menace.',
            'do you want to fucking die',
        ];
        let hasSeenDog = false;
        let angryClickCount = 0;
        let angryTimer = null;
        let audioContext = null;
        let audioSource = null;
        let distortionNode = null;
        let filterNode = null;
        let gainNode = null;

        function makeDistortionCurve(amount) {
            const samples = 2048;
            const curve = new Float32Array(samples);
            for (let i = 0; i < samples; i++) {
                const x = (i / samples) * 2 - 1;
                curve[i] = Math.tanh(x * amount) / Math.tanh(amount);
            }
            return curve;
        }

        function ensureAudioSetup() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioSource = audioContext.createMediaElementSource(video);
                filterNode = audioContext.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 1400;
                filterNode.Q.value = 1.1;

                distortionNode = audioContext.createWaveShaper();
                distortionNode.curve = makeDistortionCurve(2.6);
                distortionNode.oversample = '4x';

                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.9;

                audioSource.connect(filterNode);
                filterNode.connect(distortionNode);
                distortionNode.connect(gainNode);
                gainNode.connect(audioContext.destination);
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {});
            }
        }

        function updateDogMood() {
            const intensity = Math.min(8, angryClickCount);
            const fry = intensity * 0.16;
            video.style.filter = [
                `brightness(${1 + fry * 0.2})`,
                `contrast(${1 + fry * 0.5})`,
                `saturate(${1 + fry * 1.1})`,
                `hue-rotate(${fry * 10}deg)`,
                `sepia(${Math.min(0.35, fry * 0.12)})`,
                `grayscale(${Math.min(0.2, fry * 0.04)})`,
                `blur(${Math.min(0.4, fry * 0.03)}px)`
            ].join(' ');
            video.style.transform = `scale(${1 + fry * 0.01})`;
            panel.classList.toggle('angry', intensity >= 3);

            if (filterNode && distortionNode && gainNode) {
                if (intensity >= 3) {
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = Math.max(260, 900 - intensity * 90);
                    filterNode.Q.value = 1.0 + intensity * 0.16;
                    distortionNode.curve = makeDistortionCurve(2.2 + intensity * 0.6);
                    gainNode.gain.value = Math.max(0.3, 0.85 - intensity * 0.04);
                } else {
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = 1800;
                    filterNode.Q.value = 0.7;
                    distortionNode.curve = makeDistortionCurve(0.5);
                    gainNode.gain.value = 0.75;
                }
                video.playbackRate = Math.max(0.7, 1 - intensity * 0.05);
            }
        }

        function setRandomAngryText() {
            const message = angryMessages[Math.floor(Math.random() * angryMessages.length)];
            note.textContent = message;
        }

        button.addEventListener('click', () => {
            ensureAudioSetup();
            panel.classList.add('show');
            video.muted = false;
            video.play().catch(() => {});

            angryClickCount = Math.min(8, angryClickCount + 1);
            if (angryTimer) clearTimeout(angryTimer);
            angryTimer = setTimeout(() => {
                angryClickCount = Math.max(0, angryClickCount - 1);
                updateDogMood();
            }, 1100);

            updateDogMood();
            setRandomAngryText();
            button.textContent = angryClickCount >= 3 ? 'stop summoning jomvet' : 'summon again';
        });
    </script>
</body>
</html>
